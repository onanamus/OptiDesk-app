    <script src="app1.js"></script>
    <script src="app2.js"></script>
    <script src="app3.js"></script>
    <script>
      /* Détecteur : indique précisément quel fichier manque ou est tronqué */
      window.addEventListener("load", () => {
        setTimeout(() => {
          const manquants = [];
          if (!window.__od1) manquants.push("app1.js");
          if (!window.__od2) manquants.push("app2.js");
          if (!window.__od3) manquants.push("app3.js");
          if (manquants.length) {
            const el = document.getElementById("authRight");
            if (el)
              el.innerHTML =
                '<div style="color:#ffd9d3;font-weight:600;line-height:1.7;padding:20px">Fichier(s) introuvable(s) ou tronqué(s) :<br><b>' +
                manquants.join(", ") +
                "</b><br><br>Vérifiez que les 5 fichiers sont dans le même dossier, portent exactement ces noms, et se terminent chacun par leur ligne « window.__od...=true; ».</div>";
          }
        }, 300);
      });
    </script>
